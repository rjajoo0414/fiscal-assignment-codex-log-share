<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>財政I こども医療費助成 調査ログ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4ef;
    --surface: #ffffff;
    --text: #20201d;
    --muted: #68685f;
    --border: #d9d6cc;
    --accent: #1d6f5f;
    --danger: #9d2f2f;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
  }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 18px 56px;
  }
  .unlock {
    max-width: 520px;
    margin: 12vh auto 0;
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  h1 {
    margin: 0 0 10px;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: 0;
  }
  p {
    margin: 0 0 18px;
    color: var(--muted);
    line-height: 1.6;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 650;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  input {
    min-width: 0;
    flex: 1;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
    font: inherit;
    background: transparent;
    color: inherit;
  }
  button {
    height: 42px;
    border: 0;
    border-radius: 6px;
    padding: 0 16px;
    font: inherit;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    cursor: pointer;
  }
  button:disabled {
    cursor: wait;
    opacity: 0.65;
  }
  .status {
    min-height: 22px;
    margin-top: 12px;
    color: var(--danger);
    font-size: 14px;
  }
  .meta {
    margin-bottom: 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .note,
  .links,
  .add-log {
    margin: 14px 0 22px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    line-height: 1.65;
  }
  .links a {
    color: var(--accent);
    overflow-wrap: anywhere;
  }
  .session {
    margin-top: 28px;
  }
  .session h2 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 1.35;
    letter-spacing: 0;
  }
  code {
    overflow-wrap: anywhere;
  }
  .message {
    margin: 14px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .message header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .role {
    color: var(--text);
    font-weight: 750;
    text-transform: capitalize;
  }
  .body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding: 14px;
    line-height: 1.65;
  }
  .hidden {
    display: none;
  }
  @media (max-width: 560px) {
    .unlock {
      margin-top: 6vh;
      padding: 20px;
    }
    .row {
      flex-direction: column;
    }
    button {
      width: 100%;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171713;
      --surface: #22221d;
      --text: #f0f0eb;
      --muted: #aaa79d;
      --border: #3d3b33;
      --accent: #27806f;
      --danger: #ff8a8a;
    }
  }
</style>
</head>
<body>
<main>
  <section id="unlock" class="unlock">
    <h1 id="locked-title"></h1>
    <p>This Codex log is encrypted in this HTML file. Enter the shared passphrase to decrypt it in your browser.</p>
    <form id="form">
      <label for="password">Passphrase</label>
      <div class="row">
        <input id="password" type="password" autocomplete="current-password" required autofocus>
        <button id="button" type="submit">Unlock</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </form>
  </section>
  <section id="log" class="hidden">
    <h1 id="title"></h1>
    <div id="meta" class="meta"></div>
    <div id="note" class="note hidden"></div>
    <div id="links" class="links hidden"></div>
    <div id="add-log" class="add-log hidden"></div>
    <div id="messages"></div>
  </section>
</main>

function bytesFromBase64(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function deriveKey(password) {
  const material = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: bytesFromBase64(ENCRYPTED_LOG.salt),
      iterations: ENCRYPTED_LOG.iterations,
      hash: "SHA-256"
    },
    material,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function decryptLog(password) {
  const key = await deriveKey(password);
  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytesFromBase64(ENCRYPTED_LOG.iv) },
    key,
    bytesFromBase64(ENCRYPTED_LOG.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(plaintext));
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleString();
}

function render(data) {
  document.title = data.title || PAGE_TITLE;
  document.getElementById("title").textContent = data.title || PAGE_TITLE;
  const sessions = Array.isArray(data.sessions)
    ? data.sessions
    : [{
        title: data.sourceName || data.title || "Codex log",
        sourceName: data.sourceName || "",
        messages: Array.isArray(data.messages) ? data.messages : []
      }];
  const messageCount = sessions.reduce((sum, session) => sum + (session.messages || []).length, 0);
  document.getElementById("meta").textContent = [
    data.exportedAt ? "Exported: " + formatDate(data.exportedAt) : "",
    sessions.length + " log(s)",
    messageCount + " messages"
  ].filter(Boolean).join(" | ");

  const note = document.getElementById("note");
  if (data.note) {
    note.textContent = data.note;
    note.classList.remove("hidden");
  }

  const links = document.getElementById("links");
  links.replaceChildren();
  if (Array.isArray(data.links) && data.links.length > 0) {
    const heading = document.createElement("strong");
    heading.textContent = "Related links";
    links.append(heading);
    for (const link of data.links) {
      const paragraph = document.createElement("p");
      const anchor = document.createElement("a");
      anchor.href = link.url || "#";
      anchor.rel = "noreferrer";
      anchor.target = "_blank";
      anchor.textContent = link.label ? link.label + ": " + link.url : link.url;
      paragraph.append(anchor);
      links.append(paragraph);
    }
    links.classList.remove("hidden");
  }

  const addLog = document.getElementById("add-log");
  if (data.addLogHelp) {
    addLog.textContent = data.addLogHelp;
    addLog.classList.remove("hidden");
  }

  const container = document.getElementById("messages");
  container.replaceChildren();

  for (const session of sessions) {
    const section = document.createElement("section");
    section.className = "session";

    const heading = document.createElement("h2");
    heading.textContent = session.title || session.sourceName || "Codex log";
    section.append(heading);

    const sessionMeta = document.createElement("div");
    sessionMeta.className = "meta";
    sessionMeta.textContent = [
      session.sourceName ? "Source: " + session.sourceName : "",
      Array.isArray(session.messages) ? session.messages.length + " messages" : ""
    ].filter(Boolean).join(" | ");
    section.append(sessionMeta);

    for (const message of session.messages || []) {
      const article = document.createElement("article");
      article.className = "message";

      const header = document.createElement("header");
      const role = document.createElement("span");
      role.className = "role";
      role.textContent = message.role || "message";
      const time = document.createElement("span");
      time.textContent = formatDate(message.timestamp);
      header.append(role, time);

      const body = document.createElement("div");
      body.className = "body";
      body.textContent = message.text || "";

      article.append(header, body);
      section.append(article);
    }

    container.append(section);
  }

  document.getElementById("unlock").classList.add("hidden");
  document.getElementById("log").classList.remove("hidden");
}

document.getElementById("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("button");
  const status = document.getElementById("status");
  const password = document.getElementById("password").value;

  button.disabled = true;
  status.textContent = "Decrypting...";

  try {
    render(await decryptLog(password));
    status.textContent = "";
  } catch {
    status.textContent = "Could not decrypt. Check the passphrase.";
    button.disabled = false;
  }
});
</script>
